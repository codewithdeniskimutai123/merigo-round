services:

  postgres:
    image: postgres:17
    container_name: merigo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: merigo_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
